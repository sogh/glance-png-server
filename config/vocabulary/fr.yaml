# French starter deck. Same format as es.yaml.
label: FRANCAIS
words:

  # --- greetings and courtesy ---
  - "bonjour = hello, good day"
  - "bonsoir = good evening"
  - "salut = hi, bye"
  - "au revoir = goodbye"
  - "à bientôt = see you soon"
  - "s'il vous plaît = please"
  - "merci beaucoup = thank you very much"
  - "de rien = you're welcome"
  - "pardon = sorry, excuse me"
  - "excusez-moi = excuse me"
  - "ça va ? = how's it going?"
  - "ça va bien = it's going well"
  - "enchanté = pleased to meet you"
  - "bonne nuit = good night"
  - "bonne journée = have a good day"

  # --- people ---
  - "la femme = the woman"
  - "l'homme = the man"
  - "la fille = the girl"
  - "le garçon = the boy"
  - "la famille = the family"
  - "l'ami = the friend"
  - "le voisin = the neighbour"
  - "les gens = the people"

  # --- the farm and the garden ---
  - "la ferme = the farm"
  - "le potager = the vegetable garden"
  - "le jardin = the garden"
  - "l'arbre = the tree"
  - "la fleur = the flower"
  - "la graine = the seed"
  - "la terre = the soil"
  - "la pluie = the rain"
  - "le poulet = the chicken"
  - "le canard = the duck"
  - "l'oeuf = the egg"
  - "la vache = the cow"
  - "l'abeille = the bee"
  - "le miel = the honey"
  - "la serre = the greenhouse"

  # --- food ---
  - "le pain = the bread"
  - "le fromage = the cheese"
  - "la pomme = the apple"
  - "la fraise = the strawberry"
  - "la tomate = the tomato"
  - "l'oignon = the onion"
  - "l'ail = the garlic"
  - "la nourriture = the food"
  - "le petit déjeuner = breakfast"
  - "le dîner = dinner"
  - "l'eau = the water"
  - "le café = the coffee"
  - "j'ai faim = I'm hungry"

  # --- time ---
  - "aujourd'hui = today"
  - "demain = tomorrow"
  - "hier = yesterday"
  - "l'année = the year"
  - "la semaine = the week"
  - "le jour = the day"
  - "la nuit = the night"
  - "maintenant = now"
  - "toujours = always"
  - "tôt = early"

  # --- weather ---
  - "il fait froid = it's cold"
  - "il fait chaud = it's hot"
  - "il pleut = it's raining"
  - "le soleil = the sun"
  - "la lune = the moon"
  - "la neige = the snow"
  - "le vent = the wind"

  # --- useful verbs ---
  - "être = to be"
  - "avoir = to have"
  - "faire = to do, to make"
  - "aller = to go"
  - "vouloir = to want"
  - "pouvoir = to be able"
  - "savoir = to know"
  - "manger = to eat"
  - "boire = to drink"
  - "travailler = to work"
  - "habiter = to live"
  - "venir = to come"

  # --- getting by ---
  - "je ne comprends pas = I don't understand"
  - "où est... ? = where is...?"
  - "combien ça coûte ? = how much is it?"
  - "plus lentement = more slowly"
  - "parlez-vous anglais ? = do you speak English?"
  - "encore une fois = once more"
  - "peut-être = maybe"
  - "bien sûr = of course"

# ---------------------------------------------------------------------------
# Glance PNG server
#
# The device only ever fetches ONE url per private app slot. What that url
# returns is decided here.
# ---------------------------------------------------------------------------

timezone: America/Los_Angeles

panel:
  # Glance panels are 64px modules that daisy-chain. Height is always 32.
  # The docs recommend keeping private-app art at 192x32 or smaller.
  width: 192
  quantize_png: true          # palette-encode the PNG; typically 300-3000 bytes

server:
  host: 0.0.0.0
  port: 8080

  # Optional shared secret. Leave empty on a LAN-only deployment.
  #
  # Set it if you have to expose this server to the internet -- which the
  # Glance setup app may force, since it refuses to verify a URL that resolves
  # to a private address. With a token set, every image, preview and status
  # route needs ?k=<token>, and a wrong one answers 404 rather than 403 so a
  # stranger cannot even enumerate your channels.
  #
  #   openssl rand -hex 16      then put it in .env as GLANCE_TOKEN
  #
  # The device url then becomes .../c/main.png?k=<token>
  access_token: "${GLANCE_TOKEN:-}"

carousel:
  # advance = step to the next scene on every real fetch from the device.
  # clock   = pick purely from wall-clock time (stateless, but can skip scenes
  #           when the device's refresh interval and dwell don't line up).
  mode: advance
  dwell: 300                  # seconds per scene, clock mode only

  # Two fetches closer together than this show the same scene rather than
  # advancing twice. Stops a device retry, a browser tab or an uptime check
  # from silently skipping a scene. The device refreshes at most once a
  # minute, so this can sit well below 60 without ever blocking a real fetch.
  min_advance_interval: 30

# Shown when nothing in a channel has anything to display.
fallback:
  scene: date

sources:
  calendar:
    # Google Calendar -> Settings -> your calendar -> "Secret address in iCal
    # format". Put it in .env as GLANCE_ICS_URL; it is a password, keep it out
    # of version control.
    ics_url: "${GLANCE_ICS_URL}"
    refresh: 900              # seconds between calendar fetches
    lookahead_days: 14
  reminders:
    path: data/reminders.json

# ---------------------------------------------------------------------------
# Channels. Each one is a rotation served at /c/<name>.png
#
# Entries are tried in order. Any entry with nothing to show (no events, no
# open todos, missing art file) drops out of the rotation automatically.
#
#   takeover: true   pre-empt the whole rotation while this has content
#   when: {...}      only consider this entry inside a time window
#   params: {...}    passed to the scene
# ---------------------------------------------------------------------------
channels:

  # ---------------------------------------------------------------------
  # One channel per private-app slot. The device cycles between slots every
  # few seconds; each channel rotates its own contents on every refresh.
  #
  #   http://glance.example.com:8080/c/date.png
  #   http://glance.example.com:8080/c/today.png
  #   http://glance.example.com:8080/c/next.png
  #   http://glance.example.com:8080/c/reminders.png
  #
  # No clock anywhere: the device redraws a cached image for up to a full
  # refresh interval, so a clock is wrong most of the time it is on screen.
  # A date is correct all day.
  # ---------------------------------------------------------------------

  # Today's date. A live holiday takes the slot over.
  date:
    - scene: holiday
      takeover: true
    - scene: date

  # What is left on the calendar today.
  today:
    - scene: today-agenda

  # The next thing coming up, whenever it is.
  next:
    - scene: agenda
      params:
        count: 1
        hour24: false
        always: true

  # Reminders. Rotates between the list and the single most pressing one.
  reminders:
    - scene: reminders
      params:
        count: 3
        header: true
        always: true
    - scene: reminders
      params:
        style: hero

  # Everything in one slot, if you would rather not use four.
  main:
    - scene: holiday
      takeover: true
    - scene: agenda
      params: { count: 1 }
    - scene: reminders
      params: { count: 3 }
    - scene: date

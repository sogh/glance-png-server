# ---------------------------------------------------------------------------
# Glance PNG server
#
# The device only ever fetches ONE url per private app slot. What that url
# returns is decided here.
# ---------------------------------------------------------------------------

timezone: America/Los_Angeles

panel:
  # Glance panels are 64px modules that daisy-chain. Height is always 32.
  # The docs recommend keeping private-app art at 192x32 or smaller.
  width: 192
  quantize_png: true          # palette-encode the PNG; typically 300-3000 bytes

  # How big team crests are drawn on the `scores` panel. 14 is about the floor
  # -- below it the detailed ones (Notre Dame's interlocking ND, Ohio State's
  # buckeye) collapse into noise. A logo that still does not read at this size
  # is dropped and the abbreviation drawn instead.
  logo_size: 16

  # Time-of-day dimming, applied to every finished panel. An LED matrix at
  # full output in a dark room is unpleasant, and doing it here means no scene
  # has to think about it.
  #
  # The level ramps linearly between these points and wraps through midnight,
  # so it never visibly steps while you are looking at it. Note the 20:00
  # point: without it the level would ramp from breakfast to bedtime and noon
  # would come out dimmer than dawn.
  #
  # Set `brightness: false` to switch it off, or a plain number to pin it.
  brightness:
    floor: 0.05
    schedule:
      - { at: "06:00", level: 0.15 }   # pre-dawn
      - { at: "07:30", level: 1.00 }   # sunrise ramp done
      - { at: "20:00", level: 1.00 }   # hold full all day
      - { at: "22:00", level: 0.45 }   # evening
      - { at: "23:30", level: 0.22 }   # night

server:
  host: 0.0.0.0
  port: 8080

  # Optional shared secret. Leave empty on a LAN-only deployment.
  #
  # Set it if you have to expose this server to the internet -- which the
  # Glance setup app may force, since it refuses to verify a URL that resolves
  # to a private address. With a token set, every image, preview and status
  # route needs ?k=<token>, and a wrong one answers 404 rather than 403 so a
  # stranger cannot even enumerate your channels.
  #
  #   openssl rand -hex 16      then put it in .env as GLANCE_TOKEN
  #
  # The device url then becomes .../c/main.png?k=<token>
  access_token: "${GLANCE_TOKEN:-}"

# Where the live editor at /edit saves its changes. It never writes back to
# this file: settings.yaml is hand-authored with comments, and round-tripping
# it through a form would destroy them. Deleting the overlay reverts
# everything to what is written here.
# paths:
#   Everything defaults to sensible places beside the code -- data/overrides.json,
#   data/cache, data/state.json, assets/static, and holidays.yaml and
#   vocabulary/ beside this file. Set one here only to move it somewhere else.
#
#   Running in a container or from a package? Set GLANCE_DATA_DIR and
#   GLANCE_STATIC_DIR instead and leave this alone -- an entry here overrides
#   them, which is what you want for a deliberate choice and not what you want
#   by accident.

carousel:
  # advance = step to the next scene on every real fetch from the device.
  # clock   = pick purely from wall-clock time (stateless, but can skip scenes
  #           when the device's refresh interval and dwell don't line up).
  mode: advance
  dwell: 300                  # seconds per scene, clock mode only

  # Two fetches closer together than this show the same scene rather than
  # advancing twice. Stops a device retry, a browser tab or an uptime check
  # from silently skipping a scene. The device refreshes at most once a
  # minute, so this can sit well below 60 without ever blocking a real fetch.
  min_advance_interval: 30

# Shown when nothing in a channel has anything to display.
fallback:
  scene: date

sources:

  # ---------------------------------------------------------------------
  # One calendar per purpose. Each gets default styling here; individual
  # entries can override it with #tags -- see "Styling entries" in the README.
  #
  # Google Calendar -> Settings -> <calendar> -> "Secret address in iCal
  # format". Each is a password; keep them in .env, never in this file.
  # ---------------------------------------------------------------------
  calendars:

    # Your day: appointments, meetings, the things with times on them.
    agenda:
      url: "${GLANCE_ICS_AGENDA:-}"
      color: white
      accent: amber

    # Things to remember. Made in the same calendar app you already use, so
    # there is no second inbox to maintain.
    reminders:
      url: "${GLANCE_ICS_REMINDERS:-}"
      color: white
      accent: sky

    # Birthdays, anniversaries, the family stuff worth a look-ahead.
    events:
      url: "${GLANCE_ICS_EVENTS:-}"
      color: mint
      accent: purple

  # Weather from Open-Meteo. No API key and no account -- just coordinates.
  # Find yours by right-clicking your house in Google Maps.
  weather:
    latitude: "${GLANCE_LAT:-}"
    longitude: "${GLANCE_LON:-}"
    units: fahrenheit         # or celsius
    refresh: 900
    air_quality: true         # a second call, to a different Open-Meteo host

    # Where the AQI comes from. EPA AirNow publishes what monitors actually
    # measured; Open-Meteo derives it from an atmospheric model on a coarse
    # grid and, here at least, reads high -- 53 against the 42 the nearest
    # instrument reported the same hour, which is the difference between
    # "Moderate" and "Good" on the panel.
    #
    #   airnow      measured, falling back to the model if no monitor answers
    #   open-meteo  the model only
    #
    # Without a key this uses the undocumented endpoint behind airnow.gov,
    # which works but could change without notice. A free key from
    # airnowapi.org switches it to the documented API.
    air_quality_source: airnow
    airnow_api_key: "${GLANCE_AIRNOW_KEY:-}"

    # AirNow returns the closest reading for each pollutant separately, from
    # whatever station has one -- which here means PM2.5 from 13km away and
    # PM10 from 27km. Past this radius a monitor is measuring somebody else's
    # air, so it is dropped before the worst-pollutant rule is applied.
    aqi_max_distance_km: 25

  # Instagram follower and post counts, via the official Graph API.
  #
  # Scraping the public profile does not work -- unauthenticated requests get
  # a login wall or a 401, intermittently. An app built that way falls back to
  # a stale or zero value and shows it as fact, which is why the counts you
  # have seen elsewhere are often wrong.
  #
  # Setup (once):
  #   1. The account must be a Business or Creator account, linked to a
  #      Facebook Page. Instagram app -> Settings -> Account type.
  #   2. developers.facebook.com -> create an app -> add "Instagram Graph API"
  #   3. Graph API Explorer: pick the app and Page, request the permissions
  #      instagram_basic and pages_show_list, generate a token
  #   4. Exchange it for a long-lived token (60 days) or make a System User
  #      token, which does not expire
  #   5. Put it in .env as GLANCE_IG_TOKEN
  #
  # Leave `account` blank to report the token's own account, which is exact
  # and the simplest thing that works. Set it to another public Business or
  # Creator handle to use business_discovery instead.
  instagram:
    access_token: "${GLANCE_IG_TOKEN:-}"
    account: ""               # blank = the token's own account
    refresh: 3600             # counts move slowly; hourly is plenty

  # Baseball, from MLB's own public Stats API. No key, no account.
  #
  # `teams` takes abbreviations: SEA, LAD, NYY, BOS... Several are allowed.
  # The panel shows the last result and the next fixture together, and hands
  # the whole strip to a game that is actually in progress.
  baseball:
    teams: "SEA"
    refresh: 600              # seconds between checks
    live_refresh: 60          # poll harder while a game is being played

  # ---------------------------------------------------------------------
  # Other leagues. Each named board becomes a `scores` scene you can point
  # a channel at: `- scene: scores` with `params: { board: ncaa }`.
  #
  #   provider  espn  -> any league ESPN carries, named "<sport>/<league>"
  #             wpbl  -> the Women's Pro Baseball League
  #   teams     comma separated, matched on abbreviation OR name. Leave it
  #             empty to follow a whole league -- sensible for the WPBL's
  #             four clubs, silly for a hundred NCAA programmes.
  #   label     what the panel calls it. Defaults to the board name.
  #
  # MLB keeps its own `baseball` source above: statsapi carries the current
  # half-inning and per-side broadcast feeds, which ESPN does not.
  # ---------------------------------------------------------------------
  scoreboards:

    # NCAA football: Georgia, plus whoever is top of the AP poll this week.
    #
    # `top` is a standing instruction rather than a list to keep editing --
    # the membership changes every Sunday and the board follows it. A team
    # that is both named and ranked (Georgia at #2) is fetched once.
    #
    # ESPN wants the team abbreviation -- UGA, TEX, WASH. Look one up at
    # espn.com/college-football/team/_/id/<whatever>; it is in the page URL.
    ncaa:
      provider: espn
      league: football/college-football
      teams: "UGA"            # whose scores to follow
      top: 0                  # and nobody else's -- see `rankings` below
      poll: ap                # ap | usa (coaches) | fcs
      label: UGA
      refresh: 900            # college football is weekly; no need to hurry
      live_refresh: 60
      poll_refresh: 21600     # the poll moves once a week, not once a minute

    # The Mariners, through the same panel as everything else.
    #
    # `provider: mlb` wraps `sources.baseball` above rather than replacing it:
    # statsapi carries the current half-inning and a broadcast listing per
    # side, so a road game still says Mariners.TV rather than the home team's
    # network. ESPN's own MLB endpoint would have been simpler and is not used
    # -- a team's schedule there is 162 games and 2.8 MB.
    mariners:
      provider: mlb
      teams: "SEA"
      label: MARINERS
      refresh: 600
      live_refresh: 60

    # The WPBL played its first season in 2026. Nobody carries it -- ESPN's
    # API has twelve baseball leagues and this is not one of them -- so this
    # reads the league's own site, whose games are a WordPress custom post
    # type with the REST API left on. Scores are hand-entered there, so they
    # land when someone types them rather than at the final out.
    wpbl:
      provider: wpbl
      teams: ""               # all four
      label: WPBL
      refresh: 600
      live_refresh: 120

  # Home Assistant entity states.
  #
  # The token is a long-lived access token: open Home Assistant, click your
  # name at the bottom of the sidebar, go to the Security tab, scroll to
  # "Long-lived access tokens" and create one. It is shown once, so copy it
  # straight into .env as GLANCE_HA_TOKEN.
  homeassistant:
    url: "${GLANCE_HA_URL:-}"
    token: "${GLANCE_HA_TOKEN:-}"
    refresh: 60

  refresh: 900              # seconds between calendar fetches
  lookahead_days: 14

  # Non-time-anchored reminders, for anything that does not belong on a
  # calendar. Optional now that reminders can come from a feed.
  # reminders_file:
  #   path: data/reminders.json      # the default; uncomment only to move it

# ---------------------------------------------------------------------------
# Modes: a calendar event that changes what the panels show, while it runs.
#
# Put an event on the calendar called "Farm tour #visitors" and for exactly as
# long as that event lasts, any channel entry marked `when: {mode: visitors}`
# becomes available -- and any marked `not_mode` drops out. When the event
# ends the panels go back to normal on their own.
#
# This is deliberately not a button. A button needs pressing twice, and it is
# the second press, days later, that gets forgotten -- leaving a welcome
# banner up for a fortnight. An event has an end time.
#
#   match     what turns it on. "#tag" matches a tag; a bare phrase matches
#             case-insensitively on word boundaries, so "open house" fires on
#             "Open House 2pm" but not on "reopen household budget".
#             Defaults to the mode's own name as a tag.
#   calendars which feeds to watch. Omit for all of them.
#
# A #tag listed here is stripped from the title before it is drawn, so the
# trigger event still reads as "Farm tour" anywhere it shows up. Tagging it
# `#hide` as well keeps it off the panels entirely without stopping the mode.
#
# Check what is on:  curl -s localhost:8080/api/status | jq .modes
# ---------------------------------------------------------------------------
modes:

  # Someone is visiting. The calendar panels have nothing to say to a guest,
  # so they hand their slots to a welcome banner -- see `channels` below.
  visitors:
    match: ["#visitors", "open house", "farm tour"]

channels:

  # ---------------------------------------------------------------------
  # One channel per private-app slot. The device cycles between slots every
  # few seconds; each channel rotates its own contents on every refresh.
  #
  #   http://glance.example.com:8080/c/date.png
  #   http://glance.example.com:8080/c/today.png
  #   http://glance.example.com:8080/c/next.png
  #   http://glance.example.com:8080/c/reminders.png
  #
  # No clock anywhere: the device redraws a cached image for up to a full
  # refresh interval, so a clock is wrong most of the time it is on screen.
  # A date is correct all day.
  # ---------------------------------------------------------------------

  # Today's date. A live holiday takes the slot over.
  date:
    - scene: holiday
      takeover: true
    - scene: date

  # What is left on the calendar today. While the visitors mode is on, the
  # banner takes the slot instead -- a guest does not need our dentist
  # appointment, and the rotation picks up where it left off afterwards.
  today:
    - scene: banner
      takeover: true
      when: { mode: visitors }
      params:
        title: WELCOME
        subtitle: COME ON IN
        accent: mint
    - scene: today-agenda
      params:
        calendar: agenda

  # The next thing coming up, whenever it is.
  #
  # The visitors banner here is the second half of a matched PAIR, not a
  # repeat: this slot and `today` above are two app slots the device shows one
  # after the other, so the same card twice reads as a bug.
  #
  # The other way to do it is one sign laid across both -- set `span: 2` on
  # both entries and `part: 1` there, `part: 2` here. That only reads if the
  # device pans between slots; if it cuts, each half is a broken word.
  next:
    - scene: banner
      takeover: true
      when: { mode: visitors }
      params:
        title: GLAD YOU CAME
        subtitle: MAKE YOURSELF AT HOME
        accent: amber
    - scene: agenda
      params:
        calendar: "agenda,events"
        count: 1
        hour24: false
        always: true

  # Reminders, from the reminders calendar. Falls back to reminders.json for
  # anything that does not belong on a calendar.
  reminders:
    - scene: agenda
      params:
        calendar: reminders
        count: 3
        lookahead_days: 7
        accent: sky
        always: true
    - scene: reminders
      params:
        count: 3
        header: true

  # Scores. Three panels share one slot and take turns on each refresh:
  # Georgia's own result and next game, the AP poll, and the WPBL. Any of
  # them drops out when it has nothing to say, so in February this slot is
  # just the WPBL and in July just the football.
  #
  # `top: 0` on the ncaa board above is deliberate: every followed team costs
  # a schedule request, and the rankings panel reads the published poll
  # instead -- one cached call however many teams it shows.
  scores:
    - scene: scores
      params:
        board: ncaa
        accent: amber
    - scene: rankings
      params:
        board: ncaa
        accent: amber
        count: 0              # as many as the strip takes
    - scene: scores
      params:
        board: mariners
        accent: sky
    - scene: scores
      params:
        board: wpbl
        accent: mint

  # A word at a time. Its own slot on purpose: what teaches a language is
  # seeing the same word ten times over a week, and a panel that comes round
  # once an hour does that better than one buried in a rotation.
  #
  # Decks live in config/vocabulary/*.yaml -- add your own, delete what you
  # already know. A shorter deck means each word comes round more often.
  #
  # `reveal: 0.5` turns it into a recall test: the meaning stays hidden for
  # the first half of each word's slot. Leave it at 0 to always show both.
  learn:
    - scene: language
      params:
        language: es
        rotate: 900           # seconds per word
        label: true
        feminine_color: pink  # "la" and "una" apart from "el" and "un"
    - scene: language
      params:
        language: fr
        rotate: 900
        label: true
        feminine_color: pink

  # Everything in one slot, if you would rather not use four.
  main:
    - scene: holiday
      takeover: true
    - scene: agenda
      params: { count: 1 }
    - scene: reminders
      params: { count: 3 }
    - scene: date

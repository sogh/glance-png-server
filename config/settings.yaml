# ---------------------------------------------------------------------------
# Glance PNG server
#
# The device only ever fetches ONE url per private app slot. What that url
# returns is decided here.
# ---------------------------------------------------------------------------

timezone: America/Los_Angeles

panel:
  # Glance panels are 64px modules that daisy-chain. Height is always 32.
  # The docs recommend keeping private-app art at 192x32 or smaller.
  width: 192
  quantize_png: true          # palette-encode the PNG; typically 300-3000 bytes

  # Time-of-day dimming, applied to every finished panel. An LED matrix at
  # full output in a dark room is unpleasant, and doing it here means no scene
  # has to think about it.
  #
  # The level ramps linearly between these points and wraps through midnight,
  # so it never visibly steps while you are looking at it. Note the 20:00
  # point: without it the level would ramp from breakfast to bedtime and noon
  # would come out dimmer than dawn.
  #
  # Set `brightness: false` to switch it off, or a plain number to pin it.
  brightness:
    floor: 0.05
    schedule:
      - { at: "06:00", level: 0.15 }   # pre-dawn
      - { at: "07:30", level: 1.00 }   # sunrise ramp done
      - { at: "20:00", level: 1.00 }   # hold full all day
      - { at: "22:00", level: 0.45 }   # evening
      - { at: "23:30", level: 0.22 }   # night

server:
  host: 0.0.0.0
  port: 8080

  # Optional shared secret. Leave empty on a LAN-only deployment.
  #
  # Set it if you have to expose this server to the internet -- which the
  # Glance setup app may force, since it refuses to verify a URL that resolves
  # to a private address. With a token set, every image, preview and status
  # route needs ?k=<token>, and a wrong one answers 404 rather than 403 so a
  # stranger cannot even enumerate your channels.
  #
  #   openssl rand -hex 16      then put it in .env as GLANCE_TOKEN
  #
  # The device url then becomes .../c/main.png?k=<token>
  access_token: "${GLANCE_TOKEN:-}"

# Where the live editor at /edit saves its changes. It never writes back to
# this file: settings.yaml is hand-authored with comments, and round-tripping
# it through a form would destroy them. Deleting the overlay reverts
# everything to what is written here.
paths:
  overlay_file: data/overrides.json

carousel:
  # advance = step to the next scene on every real fetch from the device.
  # clock   = pick purely from wall-clock time (stateless, but can skip scenes
  #           when the device's refresh interval and dwell don't line up).
  mode: advance
  dwell: 300                  # seconds per scene, clock mode only

  # Two fetches closer together than this show the same scene rather than
  # advancing twice. Stops a device retry, a browser tab or an uptime check
  # from silently skipping a scene. The device refreshes at most once a
  # minute, so this can sit well below 60 without ever blocking a real fetch.
  min_advance_interval: 30

# Shown when nothing in a channel has anything to display.
fallback:
  scene: date

sources:

  # ---------------------------------------------------------------------
  # One calendar per purpose. Each gets default styling here; individual
  # entries can override it with #tags -- see "Styling entries" in the README.
  #
  # Google Calendar -> Settings -> <calendar> -> "Secret address in iCal
  # format". Each is a password; keep them in .env, never in this file.
  # ---------------------------------------------------------------------
  calendars:

    # Your day: appointments, meetings, the things with times on them.
    agenda:
      url: "${GLANCE_ICS_AGENDA:-}"
      color: white
      accent: amber

    # Things to remember. Made in the same calendar app you already use, so
    # there is no second inbox to maintain.
    reminders:
      url: "${GLANCE_ICS_REMINDERS:-}"
      color: white
      accent: sky

    # Birthdays, anniversaries, the family stuff worth a look-ahead.
    events:
      url: "${GLANCE_ICS_EVENTS:-}"
      color: mint
      accent: purple

  # Weather from Open-Meteo. No API key and no account -- just coordinates.
  # Find yours by right-clicking your house in Google Maps.
  weather:
    latitude: "${GLANCE_LAT:-}"
    longitude: "${GLANCE_LON:-}"
    units: fahrenheit         # or celsius
    refresh: 900

  refresh: 900              # seconds between calendar fetches
  lookahead_days: 14

  # Non-time-anchored reminders, for anything that does not belong on a
  # calendar. Optional now that reminders can come from a feed.
  reminders_file:
    path: data/reminders.json

channels:

  # ---------------------------------------------------------------------
  # One channel per private-app slot. The device cycles between slots every
  # few seconds; each channel rotates its own contents on every refresh.
  #
  #   http://glance.example.com:8080/c/date.png
  #   http://glance.example.com:8080/c/today.png
  #   http://glance.example.com:8080/c/next.png
  #   http://glance.example.com:8080/c/reminders.png
  #
  # No clock anywhere: the device redraws a cached image for up to a full
  # refresh interval, so a clock is wrong most of the time it is on screen.
  # A date is correct all day.
  # ---------------------------------------------------------------------

  # Today's date. A live holiday takes the slot over.
  date:
    - scene: holiday
      takeover: true
    - scene: date

  # What is left on the calendar today.
  today:
    - scene: today-agenda
      params:
        calendar: agenda

  # The next thing coming up, whenever it is.
  next:
    - scene: agenda
      params:
        calendar: "agenda,events"
        count: 1
        hour24: false
        always: true

  # Reminders, from the reminders calendar. Falls back to reminders.json for
  # anything that does not belong on a calendar.
  reminders:
    - scene: agenda
      params:
        calendar: reminders
        count: 3
        lookahead_days: 7
        accent: sky
        always: true
    - scene: reminders
      params:
        count: 3
        header: true

  # Everything in one slot, if you would rather not use four.
  main:
    - scene: holiday
      takeover: true
    - scene: agenda
      params: { count: 1 }
    - scene: reminders
      params: { count: 3 }
    - scene: date

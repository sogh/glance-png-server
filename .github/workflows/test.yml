name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor the dependencies impose. It has not been run
        # locally -- this matrix is how we find out.
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        # The suite is offline and deterministic; no secrets are needed.
        run: python -m pytest -q
      - name: Generated docs are current
        run: python tools/gendocs.py --check
